name: Release

# Push a tag like `v0.1.0` to build the `slml` compiler for every platform
# and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, wasm32-unknown-unknown
      - name: Build browser runtime
        shell: bash
        run: sh scripts/build-web.sh
      - name: Build
        run: cargo build --release --locked -p slml-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="slml-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=slml
          if [ "${{ runner.os }}" = "Windows" ]; then exe=slml.exe; fi
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE docs/slml.1 "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: slml-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: slml-firefox
          path: target/slml-firefox-0.1.0.xpi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 \
            --title "SLML $GITHUB_REF_NAME" --generate-notes
