[workspace]
resolver = "3"
members = ["crates/slml-syntax", "crates/slml-render", "crates/slml-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
slml-syntax = { path = "crates/slml-syntax" }
slml-render = { path = "crates/slml-render" }
