[package]
name = "slml-cli"
description = "The `slml` command: check, render and view SLML documents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "slml"
path = "src/main.rs"

[dependencies]
slml-syntax.workspace = true
slml-render.workspace = true
slml-html.workspace = true
minifb = { version = "0.29.0", optional = true }

[features]
default = ["viewer"]
# The native window (`slml view`). Disable for servers and CI:
# cargo install --path crates/slml-cli --no-default-features
viewer = ["dep:minifb"]
